name: Daily price sweep

on:
  schedule:
    - cron: "30 4 * * *"   # 05:30 UK (BST) â€” before the Claude 7am merge run
  workflow_dispatch: {}     # manual run button

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Run sweep
        run: node scrape.js

      - name: Upload debug dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: data/debug/
          retention-days: 14

      - name: Commit results
        run: |
          git config user.name "price-sweep-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Price sweep $(date -u +%F)"
          git pull --rebase origin main || true
          git push
