name: Daily price report

on:
  schedule:
    - cron: "30 5 * * *"   # 06:30 UK (BST) — sweep, build report, email
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Node, for scrape.js)
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Run sweep (Shurgard + Make Space + Big Top)
        run: node scrape.js
        continue-on-error: true   # a scrape hiccup must not block the report

      - name: Build report (append history + grid email)
        # data/safestore-latest.json and data/storageking-latest.json are
        # NOT produced here (see "Why Safestore/Storage King aren't
        # scraped on GitHub Actions" in README.md — both are Cloudflare/
        # reCAPTCHA-blocked from GitHub's runner IPs, confirmed
        # 2026-08-26). They're pushed to this repo by a scraper running
        # on infrastructure with a working IP, on its own schedule
        # (Mon/Wed/Fri). build_report.py reads whatever is already
        # committed at that path -- if it's stale, the grid just shows
        # last-known prices, same as any other missing/failed source.
        run: python3 build_report.py

      - name: Build price chart
        run: python3 build_chart.py
        continue-on-error: true   # chart is best-effort; never blocks the email

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Basildon Price Tracker <${{ secrets.MAIL_USERNAME }}>
          to: vikgoy@gmail.com
          cc: vikas@bigtopselfstorage.com,karan@bigtopselfstorage.com
          subject: Basildon competitor prices — daily
          html_body: file://report/email.html

      - name: Upload debug dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: data/debug/
          retention-days: 14

      - name: Commit results
        if: always()
        run: |
          git config user.name "price-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ history.csv report/
          git add price_chart.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily report $(date -u +%F)"
          git pull --rebase origin main || true
          git push