name: Daily price report

on:
  schedule:
    - cron: "30 5 * * *"   # 06:30 UK (BST) — sweep, build report, email
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    # Worst-case budget: Node scraper (~23 min: Shurgard 3 + Make Space 17 +
    # Big Top 3) + Storage King (15 min) + Safestore (45 min, the full
    # quote-wizard sweep across every size for two contract lengths) +
    # report/chart build (~2 min) = up to ~85 min. 110 gives headroom
    # without being so long a genuinely hung step burns the whole day.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Node, for scrape.js)
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Install Xvfb + patchright (Python, for Safestore/Storage King)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          pip install patchright
          python3 -m patchright install chromium
          python3 -m patchright install-deps chromium

      - name: Run sweep (Shurgard + Make Space + Big Top)
        run: node scrape.js
        continue-on-error: true   # a scrape hiccup must not block the report

      - name: Run Storage King sweep
        # Full page-load sweep is normally fast (~1-2 min); a generous
        # timeout absorbs Cloudflare Turnstile retries without blocking
        # the rest of the workflow if the site is unreachable.
        timeout-minutes: 15
        continue-on-error: true   # a scrape hiccup must not block the report
        run: |
          Xvfb :97 -screen 0 1280x900x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:97
          python3 storageking_scrape.py

      - name: Run Safestore sweep
        # Steps through the full quote wizard for every offered size, for
        # both a 3-month and a 12-month term (~22 quote submissions). Each
        # submission takes 30-60s including its own retries, so this can
        # legitimately run 20-30 minutes -- budget accordingly rather than
        # timing it out mid-sweep and losing a duration's worth of data.
        timeout-minutes: 45
        continue-on-error: true   # a scrape hiccup must not block the report
        run: |
          Xvfb :98 -screen 0 1280x900x24 -nolisten tcp &
          sleep 2
          export DISPLAY=:98
          python3 safestore_scrape.py

      - name: Build report (append history + grid email)
        run: python3 build_report.py

      - name: Build price chart
        run: python3 build_chart.py
        continue-on-error: true   # chart is best-effort; never blocks the email

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Basildon Price Tracker <${{ secrets.MAIL_USERNAME }}>
          to: vikgoy@gmail.com
          cc: vikas@bigtopselfstorage.com,karan@bigtopselfstorage.com
          subject: Basildon competitor prices — daily
          html_body: file://report/email.html

      - name: Upload debug dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            data/debug/
            data/safestore-latest.json
            data/storageking-latest.json
          retention-days: 14

      - name: Commit results
        if: always()
        run: |
          git config user.name "price-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ history.csv report/
          git add price_chart.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily report $(date -u +%F)"
          git pull --rebase origin main || true
          git push
